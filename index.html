<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FRANZZ STORE</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#050b1f;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:#fff;
}

.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at top,#0a4fff 0%,transparent 45%),
radial-gradient(circle at bottom,#00cfff 0%,transparent 45%),
#050b1f;
animation:bgMove 8s linear infinite;
}

@keyframes bgMove{
0%{filter:hue-rotate(0deg);}
100%{filter:hue-rotate(360deg);}
}

.container{
position:relative;
z-index:2;
text-align:center;
padding:20px;
}

.logo{
width:120px;
height:120px;
border-radius:50%;
border:4px solid #00bfff;
box-shadow:0 0 30px #00bfff;
animation:spin 4s linear infinite;
object-fit:cover;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

h1{
margin-top:20px;
font-size:34px;
letter-spacing:3px;
text-shadow:0 0 20px #00bfff;
}

.loading{
margin-top:10px;
font-size:18px;
color:#8ecbff;
}

.bar{
margin:25px auto;
width:320px;
max-width:90%;
height:12px;
background:#10254a;
border-radius:30px;
overflow:hidden;
box-shadow:0 0 15px #0099ff;
}

.fill{
width:0%;
height:100%;
background:linear-gradient(90deg,#00c6ff,#0066ff,#00e5ff);
animation:load 5s linear forwards;
}

@keyframes load{
100%{
width:100%;
}
}

.percent{
font-size:22px;
font-weight:bold;
text-shadow:0 0 10px #00bfff;
}

.footer{
margin-top:20px;
font-size:14px;
color:#9ddcff;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<img src="https://files.catbox.moe/nsifgl.jpg" class="logo">

<h1>FRANZZ STORE</h1>

<div class="loading">Loading Website...</div>

<div class="bar">
<div class="fill"></div>
</div>

<div class="percent" id="persen">0%</div>

<div class="footer">
Please Wait...
</div>

<audio id="welcome" autoplay>
<source src="welcome.mp3" type="audio/mpeg">
</audio>

</div>

<script>
const audio = document.getElementById("welcome");

audio.volume = 1.0;

audio.play().catch(() => {
document.body.addEventListener("click", () => {
audio.play();
},{once:true});
});

let p = 0;
const persen = document.getElementById("persen");

const timer = setInterval(() => {

p++;

persen.innerHTML = p + "%";

if(p >= 100){

clearInterval(timer);

setTimeout(()=>{
window.location.href="https://franzzstore.base44.app";
},500);

}

},50);
</script>

</body>
</html>
